<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Live Diarizer</title>
    <style>
        :root {
            --matrix-green: #00ff41;
            --matrix-dim: #008f11;
            --matrix-dark: #003b00;
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --bg-tertiary: #1a1a1a;
            --border-color: #1a3a1a;
            --text-muted: #666666;
            --cyan: #00d4ff;
            --red: #ff4757;
            --yellow: #ffd93d;
            --purple: #c77dff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
            background: var(--bg-primary);
            color: var(--matrix-green);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Scanline effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 255, 65, 0.015) 2px,
                rgba(0, 255, 65, 0.015) 4px
            );
            pointer-events: none;
            z-index: 1000;
        }

        /* Header */
        .header {
            background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--matrix-green);
            text-shadow: 0 0 10px var(--matrix-dim);
        }

        .status-group {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
        }

        .status-dot.ready { background: var(--matrix-dim); }
        .status-dot.streaming { 
            background: var(--matrix-green);
            animation: pulse 1.5s ease-in-out infinite;
            box-shadow: 0 0 8px var(--matrix-green);
        }
        .status-dot.error { background: var(--red); }

        .header-right {
            display: flex;
            gap: 24px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .header-right span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-right .value {
            color: var(--matrix-dim);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.9); }
        }

        /* Model Info Panel */
        .model-panel {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
        }

        .model-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .model-section .title {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: var(--cyan);
            text-transform: uppercase;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
        }

        .model-section .row {
            display: flex;
            gap: 8px;
            font-size: 11px;
            line-height: 1.6;
        }

        .model-section .label {
            color: var(--text-muted);
            min-width: 48px;
        }

        .model-section .value {
            color: var(--matrix-green);
        }

        .model-section .current {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(0, 255, 65, 0.1);
            border: 1px solid var(--matrix-dim);
            border-radius: 2px;
            font-size: 10px;
        }

        .engine-item {
            padding: 4px 0;
            border-bottom: 1px solid rgba(26, 58, 26, 0.3);
        }

        .engine-item:last-child {
            border-bottom: none;
        }

        /* Terminal */
        .terminal-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .terminal {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            background: var(--bg-primary);
            scroll-behavior: smooth;
        }

        .terminal::-webkit-scrollbar {
            width: 6px;
        }

        .terminal::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        .terminal::-webkit-scrollbar-thumb {
            background: var(--matrix-dark);
            border-radius: 3px;
        }

        .terminal::-webkit-scrollbar-thumb:hover {
            background: var(--matrix-dim);
        }

        .line {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 8px;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .speaker-tag {
            flex-shrink: 0;
            padding: 2px 8px;
            border: 1px solid;
            border-radius: 2px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .line-content {
            flex: 1;
            font-size: 13px;
            line-height: 1.6;
            word-break: break-word;
            color: #b8b8b8;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background: var(--matrix-green);
            margin-left: 4px;
            vertical-align: middle;
            animation: blink 0.8s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Speaker Colors */
        .spk-system { color: var(--yellow); border-color: var(--yellow); }
        .spk-file { color: var(--purple); border-color: var(--purple); }
        .spk-0 { color: var(--matrix-green); border-color: var(--matrix-green); }
        .spk-1 { color: var(--cyan); border-color: var(--cyan); }
        .spk-2 { color: var(--red); border-color: var(--red); }
        .spk-3 { color: var(--yellow); border-color: var(--yellow); }
        .spk-4 { color: var(--purple); border-color: var(--purple); }
        .spk-5 { color: #64dfdf; border-color: #64dfdf; }
        .spk-6 { color: #f72585; border-color: #f72585; }
        .spk-7 { color: #4cc9f0; border-color: #4cc9f0; }

        /* Controls */
        .controls {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: 16px 24px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            background: transparent;
            border: 1px solid var(--matrix-dim);
            color: var(--matrix-green);
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 2px;
        }

        .btn:hover:not(:disabled) {
            background: var(--matrix-green);
            color: var(--bg-primary);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
        }

        .btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn-primary {
            background: rgba(0, 255, 65, 0.1);
        }

        .btn-danger {
            border-color: var(--red);
            color: var(--red);
        }

        .btn-danger:hover:not(:disabled) {
            background: var(--red);
            color: var(--bg-primary);
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.3);
        }

        .btn-secondary {
            border-color: var(--text-muted);
            color: var(--text-muted);
        }

        .btn-secondary:hover:not(:disabled) {
            border-color: var(--matrix-dim);
            color: var(--matrix-green);
            background: transparent;
            box-shadow: none;
        }

        .spacer {
            flex: 1;
        }

        .file-input {
            display: none;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .checkbox-label input[type="checkbox"] {
            appearance: none;
            width: 14px;
            height: 14px;
            border: 1px solid var(--matrix-dim);
            background: transparent;
            cursor: pointer;
            position: relative;
        }

        .checkbox-label input[type="checkbox"]:checked {
            background: var(--matrix-dim);
        }

        .checkbox-label input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            top: -2px;
            left: 1px;
            font-size: 10px;
            color: var(--bg-primary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                padding: 12px 16px;
            }
            .header-right {
                display: none;
            }
            .model-panel {
                padding: 12px 16px;
                gap: 16px;
            }
            .terminal {
                padding: 16px;
            }
            .controls {
                padding: 12px 16px;
            }
            .btn {
                padding: 8px 16px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <div class="logo">MATRIX DIARIZER</div>
            <div class="status-group">
                <span class="status-dot ready" id="status-dot"></span>
                <span id="node-status">READY</span>
            </div>
        </div>
        <div class="header-right">
            <span>TIMEOUT <span class="value">30s</span></span>
            <span>ASR <span class="value" id="asr-model">--</span></span>
            <span>SPK <span class="value" id="spk-model">--</span></span>
        </div>
    </header>

    <section class="model-panel" id="model-panel">
        <div class="model-section">
            <div class="title">ASR Engine</div>
            <div class="row"><span class="label">Model</span><span class="value" id="asr-name">--</span></div>
            <div class="row"><span class="label">Lang</span><span class="value" id="asr-lang">--</span></div>
        </div>
        <div class="model-section">
            <div class="title">Speaker Engine</div>
            <div class="row"><span class="label">Current</span><span class="value current" id="spk-current">--</span></div>
            <div class="row"><span class="label">Model</span><span class="value" id="spk-model-name">--</span></div>
            <div class="row"><span class="label">Speed</span><span class="value" id="spk-speed">--</span></div>
        </div>
        <div class="model-section">
            <div class="title">Available Engines</div>
            <div id="engine-list"></div>
        </div>
    </section>

    <div class="terminal-container">
        <div class="terminal" id="terminal"></div>
    </div>

    <footer class="controls">
        <button class="btn btn-primary" id="startBtn" onclick="connectStream()">Start Stream</button>
        <button class="btn btn-danger" id="stopBtn" onclick="disconnectStream()" disabled>Terminate</button>
        <button class="btn btn-secondary" onclick="clearTerminal()">Clear</button>
        <span class="spacer"></span>
        <label class="checkbox-label">
            <input type="checkbox" id="enableDiarization" checked>
            <span>Speaker ID</span>
        </label>
        <input type="file" class="file-input" id="audioFile" onchange="performUpload(this)" accept=".wav,.mp3,.m4a,.flac">
        <button class="btn" onclick="document.getElementById('audioFile').click()">Upload File</button>
    </footer>

    <script>
        const HOST = '127.0.0.1:8000';
        
        // 重连配置
        const RECONNECT_CONFIG = {
            maxRetries: 5,          // 最大重连次数
            baseDelay: 1000,        // 基础延迟（毫秒）
            maxDelay: 10000,        // 最大延迟（毫秒）
            enabled: true           // 是否启用自动重连
        };
        
        const state = {
            socket: null,
            micStream: null,
            audioContext: null,
            renderQueue: [],
            isTyping: false,
            speakerColorMap: new Map(),
            colorIndex: 0,
            // 重连状态
            reconnectCount: 0,
            isManualDisconnect: false,
            reconnectTimer: null
        };

        function getSpeakerClass(speakerId) {
            if (speakerId === 'SYSTEM') return 'spk-system';
            if (speakerId === 'FILE_RESULT') return 'spk-file';
            
            if (!state.speakerColorMap.has(speakerId)) {
                state.speakerColorMap.set(speakerId, state.colorIndex % 8);
                state.colorIndex++;
            }
            return `spk-${state.speakerColorMap.get(speakerId)}`;
        }

        async function loadModelInfo() {
            try {
                const res = await fetch(`http://${HOST}/v1/models`);
                const data = await res.json();
                
                document.getElementById('asr-model').textContent = data.asr.name;
                document.getElementById('spk-model').textContent = data.speakers[data.current].name;
                document.getElementById('asr-name').textContent = data.asr.model;
                document.getElementById('asr-lang').textContent = data.asr.languages;
                
                const currentSpk = data.speakers[data.current];
                document.getElementById('spk-current').textContent = currentSpk.name;
                document.getElementById('spk-model-name').textContent = currentSpk.model;
                document.getElementById('spk-speed').textContent = currentSpk.speed;
                
                const listEl = document.getElementById('engine-list');
                listEl.innerHTML = '';
                
                for (const [key, info] of Object.entries(data.speakers)) {
                    const item = document.createElement('div');
                    item.className = 'engine-item';
                    const isCurrent = key === data.current;
                    item.innerHTML = `
                        <div class="row">
                            <span class="${isCurrent ? 'current' : 'value'}">${info.name}</span>
                            <span class="label">EER</span>
                            <span class="value">${info.eer_voxceleb}</span>
                        </div>
                    `;
                    listEl.appendChild(item);
                }
            } catch (e) {
                logSys('Cannot connect to backend service.', 'error');
            }
        }

        function logSys(msg, type = 'normal') {
            state.renderQueue.push({ speaker: 'SYSTEM', text: msg });
            if (!state.isTyping) typeWriter();
        }

        function clearTerminal() {
            document.getElementById('terminal').innerHTML = '';
            state.speakerColorMap.clear();
            state.colorIndex = 0;
            logSys('Terminal cleared.');
        }

        async function typeWriter() {
            if (state.renderQueue.length === 0) {
                state.isTyping = false;
                return;
            }
            state.isTyping = true;
            
            const { speaker, text } = state.renderQueue.shift();
            const terminal = document.getElementById('terminal');
            
            let lastLine = terminal.querySelector('.line:last-child');
            const shouldAppend = lastLine && 
                                lastLine.dataset.speaker === speaker && 
                                speaker !== 'SYSTEM' && 
                                speaker !== 'FILE_RESULT';
            
            if (!shouldAppend) {
                lastLine = document.createElement('div');
                lastLine.className = 'line';
                lastLine.dataset.speaker = speaker;
                
                const colorClass = getSpeakerClass(speaker);
                lastLine.innerHTML = `
                    <span class="speaker-tag ${colorClass}">${speaker}</span>
                    <span class="line-content"></span>
                    <span class="cursor"></span>
                `;
                terminal.appendChild(lastLine);
            }

            const content = lastLine.querySelector('.line-content');
            
            for (let i = 0; i < text.length; i += 2) {
                content.textContent += text.slice(i, i + 2);
                terminal.scrollTop = terminal.scrollHeight;
                await new Promise(r => setTimeout(r, 12));
            }
            
            setTimeout(() => {
                const cursor = lastLine.querySelector('.cursor');
                if (cursor) cursor.remove();
            }, 400);
            
            requestAnimationFrame(typeWriter);
        }

        function setStatus(status, text) {
            const dot = document.getElementById('status-dot');
            const statusText = document.getElementById('node-status');
            dot.className = `status-dot ${status}`;
            statusText.textContent = text;
        }

        function getReconnectDelay() {
            // 指数退避：delay = min(baseDelay * 2^retry, maxDelay)
            const delay = Math.min(
                RECONNECT_CONFIG.baseDelay * Math.pow(2, state.reconnectCount),
                RECONNECT_CONFIG.maxDelay
            );
            // 添加随机抖动，避免同时重连
            return delay + Math.random() * 500;
        }

        function scheduleReconnect() {
            if (!RECONNECT_CONFIG.enabled) return;
            if (state.isManualDisconnect) return;
            
            if (state.reconnectCount >= RECONNECT_CONFIG.maxRetries) {
                logSys(`Reconnect failed after ${RECONNECT_CONFIG.maxRetries} attempts.`);
                setStatus('error', 'RECONNECT_FAILED');
                return;
            }
            
            const delay = getReconnectDelay();
            state.reconnectCount++;
            
            logSys(`Reconnecting in ${Math.round(delay / 1000)}s... (attempt ${state.reconnectCount}/${RECONNECT_CONFIG.maxRetries})`);
            setStatus('ready', `RECONNECT_${state.reconnectCount}`);
            
            state.reconnectTimer = setTimeout(() => {
                connectStream(true);  // isReconnect = true
            }, delay);
        }

        async function connectStream(isReconnect = false) {
            // 清除重连定时器
            if (state.reconnectTimer) {
                clearTimeout(state.reconnectTimer);
                state.reconnectTimer = null;
            }
            
            // 重连时重置手动断开标志
            if (isReconnect) {
                state.isManualDisconnect = false;
            }
            
            const uid = Math.random().toString(36).substring(7);
            state.socket = new WebSocket(`ws://${HOST}/ws/v1/stream/${uid}`);

            state.socket.onopen = () => {
                logSys(isReconnect ? 'Reconnected successfully.' : 'Connection established. Waiting for audio input...');
                setStatus('streaming', 'STREAMING');
                document.getElementById('startBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
                // 重置重连计数
                state.reconnectCount = 0;
            };

            state.socket.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (data.text) {
                    state.renderQueue.push({ speaker: data.speaker, text: data.text });
                    if (!state.isTyping) typeWriter();
                }
            };

            state.socket.onerror = () => {
                logSys('WebSocket connection error.', 'error');
                setStatus('error', 'ERROR');
            };

            state.socket.onclose = (e) => {
                // 非手动断开，尝试重连
                if (!state.isManualDisconnect) {
                    if (e.code === 1000) {
                        logSys('Connection closed by server (timeout).');
                    } else {
                        logSys(`Connection lost (code: ${e.code}).`);
                    }
                    resetUI(false);  // 不完全重置，保留麦克风
                    scheduleReconnect();
                } else {
                    logSys('Disconnected.');
                    resetUI(true);
                }
            };

            // 首次连接时获取麦克风
            if (!state.micStream) {
                try {
                    state.micStream = await navigator.mediaDevices.getUserMedia({ 
                        audio: {
                            echoCancellation: true,
                            noiseSuppression: true,
                            sampleRate: 16000
                        }
                    });
                    
                    state.audioContext = new AudioContext({ sampleRate: 16000 });
                    const source = state.audioContext.createMediaStreamSource(state.micStream);
                    const processor = state.audioContext.createScriptProcessor(4096, 1, 1);
                    
                    processor.onaudioprocess = (e) => {
                        if (state.socket && state.socket.readyState === WebSocket.OPEN) {
                            const input = e.inputBuffer.getChannelData(0);
                            const output = new Int16Array(input.length);
                            for (let i = 0; i < input.length; i++) {
                                const s = Math.max(-1, Math.min(1, input[i]));
                                output[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                            }
                            state.socket.send(output.buffer);
                        }
                    };
                    
                    source.connect(processor);
                    processor.connect(state.audioContext.destination);
                    
                } catch (e) {
                    logSys('Microphone access denied: ' + e.message, 'error');
                    disconnectStream();
                }
            }
        }

        function resetUI(full = true) {
            if (full) {
                if (state.micStream) {
                    state.micStream.getTracks().forEach(t => t.stop());
                    state.micStream = null;
                }
                if (state.audioContext) {
                    state.audioContext.close();
                    state.audioContext = null;
                }
            }
            
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            
            if (full) {
                setStatus('ready', 'READY');
                state.reconnectCount = 0;
                state.isManualDisconnect = false;
            }
        }

        function disconnectStream() {
            // 标记为手动断开，阻止自动重连
            state.isManualDisconnect = true;
            
            // 清除重连定时器
            if (state.reconnectTimer) {
                clearTimeout(state.reconnectTimer);
                state.reconnectTimer = null;
            }
            
            if (state.socket) {
                state.socket.close();
                state.socket = null;
            }
            resetUI(true);
        }

        async function performUpload(input) {
            if (!input.files.length) return;
            
            const file = input.files[0];
            const enableDiarization = document.getElementById('enableDiarization').checked;
            
            logSys(`Uploading: ${file.name} (${enableDiarization ? 'speaker diarization' : 'fast transcription'})...`);

            const fd = new FormData();
            fd.append('file', file);

            try {
                // 添加 enable_diarization 参数
                const url = `http://${HOST}/v1/upload?enable_diarization=${enableDiarization}`;
                const res = await fetch(url, { method: 'POST', body: fd });
                const data = await res.json();
                
                if (data.status === 'success') {
                    if (data.segments && data.segments.length > 1) {
                        // 长音频：显示分段结果
                        logSys(`Done. Duration: ${data.duration.toFixed(1)}s, Speakers: ${data.speakers?.length || 1}`);
                        for (const seg of data.segments) {
                            if (seg.text) {
                                state.renderQueue.push({ speaker: seg.speaker, text: seg.text });
                            }
                        }
                    } else {
                        // 短音频：显示单个结果
                        logSys(`Done. [${data.speaker}]:`);
                        state.renderQueue.push({ speaker: 'FILE_RESULT', text: data.text });
                    }
                    if (!state.isTyping) typeWriter();
                } else {
                    logSys('Failed: ' + data.message, 'error');
                }
            } catch (e) {
                logSys('Request failed. Check backend.', 'error');
            }
            
            input.value = '';
        }

        loadModelInfo();
        logSys('System initialized. Ready for input.');
    </script>
</body>
</html>
