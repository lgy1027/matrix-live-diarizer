<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>设置 - Matrix Live Diarizer</title>
  <link rel="icon" type="image/x-icon" href="/web/favicon.ico">
  <link rel="stylesheet" href="/web/css/common.css">
</head>
<body>
  <nav class="top-nav">
    <span class="logo">⚡ Matrix</span>
    <a href="/web/index.html">实时</a>
    <a href="/web/history.html">历史</a>
    <a href="/web/settings.html" class="active">设置</a>
    <div style="flex:1"></div>
    <div id="userMenu"></div>
    <span class="badge-private">🔒 离线</span>
  </nav>
  <div class="container">
    <h1>系统设置</h1>

    <div class="card">
      <h2>声纹引擎</h2>
      <p>当前: <span id="current-engine">加载中...</span></p>
      <select id="engine-select">
        <option value="campplus">CamPlus (快)</option>
        <option value="eres2net">ERes2NetV2 (高精度)</option>
        <option value="wespeaker">Wespeaker (经典)</option>
      </select>
      <button class="btn" id="btn-switch">切换</button>
    </div>

    <div class="card">
      <h2>本地 LLM</h2>
      <p style="color:#888; font-size:0.9rem;">
        本项目<strong>不会</strong>将你的数据发送到云端 LLM。endpoint 必须为本机或内网地址。
      </p>
      <label><input type="checkbox" id="llm-enabled"> 启用</label>
      <div style="margin-top:0.5rem;">
        <input type="text" id="llm-endpoint" placeholder="http://127.0.0.1:11434/v1" style="width:300px;">
      </div>
      <div style="margin-top:0.5rem;">
        模型: <input type="text" id="llm-model" placeholder="qwen2.5:1.5b">
      </div>
      <button class="btn" id="btn-test-llm">测试连接</button>
      <span id="llm-status" style="margin-left:1rem;"></span>
    </div>

    <div class="card">
      <h2>历史存储</h2>
      <label><input type="checkbox" id="history-enabled" disabled> 启用转写历史存档</label>
      <p style="color:#888; font-size:0.9rem;">
        通过环境变量 <code>STORAGE_HISTORY_ENABLED</code> 配置（重启后生效）。
      </p>
    </div>

    <div class="card" id="account">
      <h2>账户</h2>
      <p>当前: <strong id="current-user">加载中...</strong></p>
      <div style="display:flex; gap:8px; margin-top:0.5rem;">
        <button class="btn" id="btn-change-pwd">修改密码</button>
        <button class="btn" id="btn-logout" style="background:#FF4757; color:#fff; border:none; padding:8px 16px; border-radius:4px; cursor:pointer;">退出登录</button>
      </div>
    </div>
  </div>

  <!-- 修改密码 modal -->
  <div id="pwdModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); place-items:center; z-index:200; padding:16px;">
    <div style="background:#1a1a1a; border:1px solid #4ECDC4; border-radius:8px; padding:32px 28px; max-width:380px; width:100%; margin:auto;">
      <h2 style="font-family:Georgia,serif; font-size:22px; margin-bottom:6px; color:#4ECDC4;">修改密码</h2>
      <div style="margin-bottom:12px; margin-top:18px;">
        <label style="display:block; font-family:monospace; font-size:10px; color:#888; text-transform:uppercase; margin-bottom:4px">当前密码</label>
        <input id="modal-old-pwd" type="password" style="width:100%; padding:10px 12px; background:#0a0a0a; border:1px solid #333; border-radius:4px; color:#fff; font-family:monospace; box-sizing:border-box;" />
      </div>
      <div style="margin-bottom:12px;">
        <label style="display:block; font-family:monospace; font-size:10px; color:#888; text-transform:uppercase; margin-bottom:4px">新密码(≥6 字符)</label>
        <input id="modal-new-pwd" type="password" style="width:100%; padding:10px 12px; background:#0a0a0a; border:1px solid #333; border-radius:4px; color:#fff; font-family:monospace; box-sizing:border-box;" />
      </div>
      <div id="modal-pwd-err" style="color:#FF4757; font-size:11px; margin:8px 0; min-height:14px;"></div>
      <div style="display:flex; gap:8px;">
        <button class="btn" id="modal-pwd-cancel" style="background:transparent; color:#888; border:1px solid #333; padding:10px 16px; border-radius:4px; cursor:pointer; flex:1">取消</button>
        <button class="btn" id="modal-pwd-submit" style="background:#4ECDC4; color:#000; border:none; padding:10px 16px; border-radius:4px; cursor:pointer; font-weight:500; flex:1">确认</button>
      </div>
    </div>
  </div>

  <script src="/web/js/auth.js"></script>
  <script src="/web/js/api.js"></script>
  <script src="/web/js/settings.js"></script>
  <script>MatrixAuth.requireAuth(); MatrixAuth.renderUserMenu();</script>
  <script>
    // 显示当前用户
    (function () {
      const u = MatrixAuth.getUser();
      document.getElementById("current-user").textContent = u ? u.username : "未知";
    })();
    // 退出登录
    document.getElementById("btn-logout").addEventListener("click", async () => {
      if (!confirm("确认退出登录?")) return;
      try { await Matrix.api.post("auth/logout", {}); } catch {}
      MatrixAuth.clearToken();
      location.href = "/web/login.html";
    });
    // 修改密码 modal
    const pwdModal = document.getElementById("pwdModal");
    const pwdModalErr = document.getElementById("modal-pwd-err");
    document.getElementById("btn-change-pwd").addEventListener("click", () => {
      pwdModal.style.display = "grid";
      pwdModalErr.textContent = "";
      document.getElementById("modal-old-pwd").value = "";
      document.getElementById("modal-new-pwd").value = "";
      document.getElementById("modal-old-pwd").focus();
    });
    document.getElementById("modal-pwd-cancel").addEventListener("click", () => {
      pwdModal.style.display = "none";
    });
    document.getElementById("modal-pwd-submit").addEventListener("click", async () => {
      const oldP = document.getElementById("modal-old-pwd").value;
      const newP = document.getElementById("modal-new-pwd").value;
      if (!oldP || newP.length < 6) {
        pwdModalErr.textContent = "新密码 ≥ 6 字符";
        return;
      }
      const btn = document.getElementById("modal-pwd-submit");
      btn.disabled = true; btn.textContent = "修改中...";
      try {
        const data = await Matrix.api.post("auth/change-password", { old_password: oldP, new_password: newP });
        if (data.token) {
          localStorage.setItem("matrix_token", data.token);
          localStorage.setItem("matrix_user", JSON.stringify(data.user));
        }
        pwdModal.style.display = "none";
        alert("密码已修改 ✓");
      } catch (e) {
        pwdModalErr.textContent = e.message || "修改失败";
      } finally {
        btn.disabled = false; btn.textContent = "确认";
      }
    });
    // 顶部 userMenu 点"修改密码"会跳 #account 锚点,自动弹 modal
    if (location.hash === "#account") {
      setTimeout(() => document.getElementById("btn-change-pwd").click(), 200);
    }
  </script>
</body>
</html>
