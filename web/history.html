<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>历史会话 - Matrix Live Diarizer</title>
  <link rel="icon" type="image/x-icon" href="/web/favicon.ico">
  <link rel="stylesheet" href="/web/css/common.css">
  <style>
    /* Roadmap #2.2 全文搜索命中面板 */
    .hits-header { padding: 0.5rem 0; border-bottom: 1px solid #2a2a2a; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 1rem; }
    .hits-header strong { color: #4ade80; font-size: 1.2em; }
    .hit { padding: 0.75rem 1rem; margin: 0.5rem 0; background: #1a1a1a; border-left: 3px solid #4ade80; border-radius: 0 4px 4px 0; }
    .hit-meta { color: #888; font-size: 0.85rem; margin-bottom: 0.25rem; }
    .hit-meta a { color: #4ade80; }
    .hit-spk { font-family: ui-monospace, monospace; }
    .hit-time { color: #666; }
    .hit-snippet { font-family: ui-monospace, "SF Mono", Menlo, monospace; line-height: 1.6; }
    .hit-snippet mark { background: rgba(251, 191, 36, 0.3); color: #fbbf24; padding: 0 2px; border-radius: 2px; }
    .btn-sm { padding: 0.2rem 0.6rem; font-size: 0.85rem; }
  </style>
</head>
<body>
  <nav class="top-nav">
    <span class="logo">⚡ Matrix</span>
    <a href="/web/index.html">实时</a>
    <a href="/web/history.html" class="active">历史</a>
    <a href="/web/settings.html">设置</a>
    <span class="badge-private">🔒 离线</span>
  </nav>
  <div class="container">
    <h1>历史会话</h1>
    <div class="card">
      <div style="display:flex; gap:1rem; flex-wrap:wrap;">
        <input type="text" id="search-q" placeholder="搜索标题或文件名">
        <select id="filter-source">
          <option value="">全部来源</option>
          <option value="websocket">实时</option>
          <option value="upload">上传</option>
        </select>
        <button class="btn" id="btn-search">搜索</button>
      </div>
    </div>
    <div class="card">
      <table id="history-table">
        <thead>
          <tr>
            <th>时间</th><th>标题</th><th>来源</th>
            <th>时长</th><th>说话人</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="history-tbody">
          <tr><td colspan="6" class="empty">加载中...</td></tr>
        </tbody>
      </table>
    </div>
    <div id="hits-panel" style="display:none"></div>
  </div>
  </div>
  <script src="/web/js/api.js"></script>
  <script src="/web/js/history.js"></script>
</body>
</html>
