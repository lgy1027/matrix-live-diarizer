name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # 不装 torch / modelscope — conftest.py 的 fake 注入绕过
        # (CI 体积小、跑得快)
        # 必须包含 summa(test_extractive_summary 用)+ setuptools<81 + 隐式依赖
        run: |
          python -m pip install --upgrade pip
          pip install 'fastapi' 'uvicorn>=0.23.0' 'python-multipart>=0.0.6' \
                      'transformers>=4.30.0' 'chromadb' 'pydantic>=2.0.0' \
                      'python-dotenv>=1.0.0' 'pytest' 'pytest-asyncio' 'pytest-timeout' 'httpx' \
                      'soundfile' 'summa==1.2.0' \
                      'setuptools<81' 'addict' 'simplejson' 'sortedcontainers' 'cffi'

      - name: Run tests
        env:
          SPEAKER_ENGINE: campplus
          STORAGE_DB_PATH: ./data/test.db
          LLM_MOCK: "true"
        run: |
          mkdir -p data
          # 忽略 test_smoke_boot.py:它需要下载 1.8GB ASR 模型,CI 不下
          pytest tests/ -v --tb=short --ignore=tests/test_smoke_boot.py

      - name: Privacy audit
        run: |
          pytest tests/test_privacy_audit.py -v

  # 前端 JS 语法 + i18n 覆盖 — 防止 v0.2.1 重构 i18n.js 那种
  # 缺 ) 错逃过 CI
  js-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check all JS
        run: |
          for f in web/js/*.js; do
            echo "checking $f"
            node --check "$f"
          done
      - name: i18n coverage check
        run: |
          python3 <<'PY'
          import re
          from pathlib import Path
          idx = Path("web/index.html").read_text()
          # 找所有 data-i18n-* key
          keys = set()
          for m in re.finditer(r'data-i18n(?:-(\w+))?="([^"]+)"', idx):
              keys.add(m.group(2))
          keys.discard("0,0")  # 误报
          i18n = Path("web/js/i18n.js").read_text()
          m = re.search(r'const STRINGS = \{(.+?)\n\};', i18n, re.DOTALL)
          defined = set(re.findall(r"'([^']+)':\s*'", m.group(1))) if m else set()
          missing = keys - defined
          if missing:
              print(f"❌ 缺失 i18n keys: {sorted(missing)}")
              exit(1)
          print(f"✅ 所有 {len(keys)} 个 i18n key 已覆盖")
          PY
