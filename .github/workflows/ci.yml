name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # Windows 慢且偶发时序 flaky(时间戳秒精度跨秒 / asyncio.sleep 累计不足),
    # 不阻塞 PR 合并;ubuntu/macos 挂了才阻塞。Windows 结果仍在 PR checks 显示。
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run tests
        shell: bash
        env:
          SPEAKER_ENGINE: campplus
          STORAGE_DB_PATH: ./data/test.db
          LLM_MOCK: "true"
        run: |
          mkdir -p data
          # 忽略 test_smoke_boot.py:它需要下载 1.8GB ASR 模型,CI 不下
          pytest tests/ -v --tb=short --ignore=tests/test_smoke_boot.py

      - name: Privacy audit
        shell: bash
        run: |
          pytest tests/test_privacy_audit.py -v

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: |
          npm ci
      - name: Typecheck frontend
        working-directory: web
        run: |
          npm run typecheck
      - name: Check i18n dictionaries
        working-directory: web
        run: npm run check:i18n
      - name: Build frontend
        working-directory: web
        run: |
          npm run build

      - name: Audit production dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
