name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # 不装 torch / modelscope — conftest.py 的 fake 注入绕过
        # (CI 体积小、跑得快)
        # 必须包含 summa(test_extractive_summary 用)+ setuptools<81 + 隐式依赖
        run: |
          python -m pip install --upgrade pip
          pip install 'fastapi' 'uvicorn>=0.23.0' 'python-multipart>=0.0.6' \
                      'transformers>=4.30.0' 'chromadb' 'pydantic>=2.0.0' \
                      'python-dotenv>=1.0.0' 'pytest' 'pytest-asyncio' 'pytest-timeout' 'httpx' \
                      'numpy' 'soundfile' 'tinycss2' 'summa==1.2.0' \
                      'PyJWT>=2.8.0' 'werkzeug>=3.0.0' \
                      'setuptools<81' 'addict' 'simplejson' 'sortedcontainers' 'cffi'

      - name: Run tests
        env:
          SPEAKER_ENGINE: campplus
          STORAGE_DB_PATH: ./data/test.db
          LLM_MOCK: "true"
        run: |
          mkdir -p data
          # 忽略 test_smoke_boot.py:它需要下载 1.8GB ASR 模型,CI 不下
          pytest tests/ -v --tb=short --ignore=tests/test_smoke_boot.py

      - name: Privacy audit
        run: |
          pytest tests/test_privacy_audit.py -v

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: |
          npm ci
      - name: Typecheck frontend
        working-directory: web
        run: |
          npm run typecheck
      - name: Build frontend
        working-directory: web
        run: |
          npm run build
