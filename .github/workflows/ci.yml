name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

# 最小权限:CI 只需读仓库内容,防止 GITHUB_TOKEN 默认权限过大被滥用。
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # Windows 慢且偶发时序 flaky(时间戳秒精度跨秒 / asyncio.sleep 累计不足),
    # 不阻塞 PR 合并;ubuntu/macos 挂了才阻塞。Windows 结果仍在 PR checks 显示。
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run tests
        shell: bash
        env:
          SPEAKER_ENGINE: campplus
          STORAGE_DB_PATH: ./data/test.db
          LLM_MOCK: "true"
        run: |
          mkdir -p data
          # 忽略 test_smoke_boot.py:它需要下载 1.8GB ASR 模型,CI 不下
          pytest tests/ -v --tb=short --ignore=tests/test_smoke_boot.py

      - name: Privacy audit
        shell: bash
        run: |
          pytest tests/test_privacy_audit.py -v

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: |
          npm ci
      - name: Typecheck frontend
        working-directory: web
        run: |
          npm run typecheck
      - name: Check i18n dictionaries
        working-directory: web
        run: npm run check:i18n
      - name: Run frontend unit tests
        working-directory: web
        run: npm test
      - name: Build frontend
        working-directory: web
        run: |
          npm run build

      - name: Audit production dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  quality-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Ruff
        run: ruff check app engine main.py scripts
      - name: Coverage gate
        env:
          SPEAKER_ENGINE: campplus
          STORAGE_DB_PATH: ./data/coverage.db
          LLM_MOCK: "true"
        run: |
          mkdir -p data
          pytest tests/ -q --ignore=tests/test_smoke_boot.py \
            --cov=app --cov=engine --cov-report=term-missing
      - name: Audit Python dependencies
        run: |
          # Temporary reviewed exceptions are documented in SECURITY.md.
          # Any new advisory still fails this job.
          pip-audit -r requirements.txt \
            --ignore-vuln PYSEC-2025-194 \
            --ignore-vuln PYSEC-2025-217 \
            --ignore-vuln PYSEC-2026-2288 \
            --ignore-vuln PYSEC-2026-2289 \
            --ignore-vuln PYSEC-2026-2290 \
            --ignore-vuln PYSEC-2026-3447

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
